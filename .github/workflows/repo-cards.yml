name: Repo cards

# Renders a pinned-repo card (light + dark) for each repository listed in the
# README's Repositories section and commits the SVGs to assets/cards/.
# Uses stats-organization/github-readme-stats-action, so nothing depends on
# the public Vercel instance. Keep the list below in sync with the README.
on:
  schedule:
    - cron: "20 16 * * *"   # 00:20 Taiwan time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/repo-cards.yml"]

permissions:
  contents: write

concurrency:
  group: repo-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIGHT: bg_color=f6f8fa&border_color=0969da&title_color=0969da&icon_color=0969da&text_color=1f2328&border_radius=8&description_lines_count=2
      DARK: bg_color=161b22&border_color=2f81f7&title_color=58a6ff&icon_color=58a6ff&text_color=c9d1d9&border_radius=8&description_lines_count=2
    steps:
      - uses: actions/checkout@v5

      - name: NDTwin-Kernel-P4 (light)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=NDTwin-Kernel-P4&${{ env.LIGHT }}
          path: assets/cards/NDTwin-Kernel-P4.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: NDTwin-Kernel-P4 (dark)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=NDTwin-Kernel-P4&${{ env.DARK }}
          path: assets/cards/NDTwin-Kernel-P4-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: ndtwin-analysis (light)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ndtwin-analysis&${{ env.LIGHT }}
          path: assets/cards/ndtwin-analysis.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: ndtwin-analysis (dark)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ndtwin-analysis&${{ env.DARK }}
          path: assets/cards/ndtwin-analysis-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: cache-aware-riscv-optimization (light)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=cache-aware-riscv-optimization&${{ env.LIGHT }}
          path: assets/cards/cache-aware-riscv-optimization.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: cache-aware-riscv-optimization (dark)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=cache-aware-riscv-optimization&${{ env.DARK }}
          path: assets/cards/cache-aware-riscv-optimization-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: fourier-comms-matlab (light)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=fourier-comms-matlab&${{ env.LIGHT }}
          path: assets/cards/fourier-comms-matlab.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: fourier-comms-matlab (dark)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=fourier-comms-matlab&${{ env.DARK }}
          path: assets/cards/fourier-comms-matlab-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: PIC18F4520-Assembly-Labs (light)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=PIC18F4520-Assembly-Labs&${{ env.LIGHT }}
          path: assets/cards/PIC18F4520-Assembly-Labs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: PIC18F4520-Assembly-Labs (dark)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=PIC18F4520-Assembly-Labs&${{ env.DARK }}
          path: assets/cards/PIC18F4520-Assembly-Labs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: rvv-mel-spectrogram (light)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=rvv-mel-spectrogram&${{ env.LIGHT }}
          path: assets/cards/rvv-mel-spectrogram.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: rvv-mel-spectrogram (dark)
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=rvv-mel-spectrogram&${{ env.DARK }}
          path: assets/cards/rvv-mel-spectrogram-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit cards if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git commit -m "Regenerate repo cards [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
