name: Terminal card

# Refreshes the live rows (Repos, Commits, Followers) of the neofetch-style card
# in README.md once a day. Commits only when a number changed.
on:
  schedule:
    - cron: "30 16 * * *"   # 00:30 Taiwan time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-card-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Refresh the card
        run: python3 scripts/update_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Card unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh terminal card stats [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
