name: Profile art

# Regenerates the contribution snake and the 3D contribution graph once a day and
# publishes them to the `output` branch, so `main` stays free of generated commits.
on:
  schedule:
    - cron: "0 16 * * *"   # 00:00 Taiwan time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-art.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect outputs
        run: cp profile-3d-contrib/*.svg dist/

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Regenerate profile art"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
