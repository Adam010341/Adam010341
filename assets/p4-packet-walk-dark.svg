<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-labelledby="t d">
<title id="t">A packet crossing a two-switch P4 fabric</title>
<desc id="d">A packet travels h1, s1, s2, h2. Each BMv2 switch looks it up in flow_5tuple first and in ipv4_lpm on a miss. One pass in three, s1 clones a sampled copy to the P4 proxy agent, which sends an sFlow v5 datagram to the NDTwin kernel.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#e6edf3}
.tbl,.tag,.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.tbl{font-size:11.5px}
.tag{font-size:10.5px;text-anchor:end;opacity:0}
.cap,.note,.lg{font-size:10.5px;fill:#9198a1}
.lbl{font-size:12px;text-anchor:middle}
.ln{stroke:#3d444d;stroke-width:1.5}
.cpu{stroke:#9198a1;stroke-opacity:.55;stroke-width:1.2;stroke-dasharray:3 4;fill:none}
.card{fill:#151b23;stroke:#3d444d}
.box{fill:#0d1117;stroke:#3d444d;stroke-width:1.2}
.row{fill:#11294a;stroke:#4493f8;opacity:0}
.hl{fill:none;stroke:#4493f8;stroke-width:2;opacity:0}
.hit{fill:#3fb950}.miss{fill:#9198a1}
.pkt{fill:#4493f8}.cln{fill:#f0883e}.sfl{fill:#ab7df8}
.hl,.row,.tag,#cl,#sf{animation-timing-function:ease-in-out;animation-iteration-count:infinite}
#pk{animation:pk 3.2s infinite ease-in-out}
#s1h{animation-name:s1h;animation-duration:3.2s}#s2h{animation-name:s2h;animation-duration:3.2s}
#s1a{animation-name:s1a;animation-duration:3.2s}#s1t{animation-name:s1t;animation-duration:3.2s}
#s2a{animation-name:s2a;animation-duration:3.2s}#s2m{animation-name:s2m;animation-duration:3.2s}
#s2b{animation-name:s2b;animation-duration:3.2s}#s2t{animation-name:s2t;animation-duration:3.2s}
#cl{animation-name:cl;animation-duration:9.600000000000001s}#sf{animation-name:sf;animation-duration:9.600000000000001s}
#pxh{animation-name:pxh;animation-duration:9.600000000000001s}#kh{animation-name:kh;animation-duration:9.600000000000001s}
@keyframes pk{0%,4%{transform:translate(56px,118px)}20%,36%{transform:translate(280px,118px)}54%,70%{transform:translate(520px,118px)}88%,100%{transform:translate(744px,118px)}}
@keyframes s1h{0%,17%,42%,100%{opacity:0}21%,36%{opacity:1}}
@keyframes s2h{0%,51%,76%,100%{opacity:0}55%,70%{opacity:1}}
@keyframes s1a{0%,20%,54%,100%{opacity:0}23%,44%{opacity:1}}
@keyframes s1t{0%,24%,54%,100%{opacity:0}27%,44%{opacity:1}}
@keyframes s2a{0%,54%,67%,100%{opacity:0}57%,62%{opacity:1}}
@keyframes s2m{0%,57%,86%,100%{opacity:0}59%,78%{opacity:1}}
@keyframes s2b{0%,61%,88%,100%{opacity:0}64%,78%{opacity:1}}
@keyframes s2t{0%,64%,88%,100%{opacity:0}67%,78%{opacity:1}}
@keyframes cl{0%,44%{transform:translate(280px,118px);opacity:0}44.6%{opacity:1}51%{transform:translate(376px,189px);opacity:1}51.6%,100%{transform:translate(376px,189px);opacity:0}}
@keyframes pxh{0%,50%,61%,100%{opacity:0}52%,56%{opacity:1}}
@keyframes sf{0%,54%{transform:translate(440px,189px);opacity:0}54.6%{opacity:1}61%{transform:translate(680px,189px);opacity:1}61.6%,100%{transform:translate(680px,189px);opacity:0}}
@keyframes kh{0%,59%,72%,100%{opacity:0}61.5%,66%{opacity:1}}
@media (prefers-reduced-motion:reduce){#pk,.hl,.row,.tag,#cl,#sf{animation:none}#pk{transform:translate(400px,118px)}}
</style>

<!-- links -->
<line class="ln" x1="56" y1="118" x2="744" y2="118"/>
<line class="cpu" x1="280" y1="118" x2="376" y2="189"/>
<line class="cpu" x1="520" y1="118" x2="424" y2="189"/>
<path class="ln" d="M480 189H592" fill="none"/>
<path d="M592 185l7 4-7 4z" fill="#3d444d"/>

<!-- moving parts, drawn under the boxes so they vanish into them -->
<rect id="pk" class="pkt" x="-9" y="-5" width="18" height="10" rx="2"/>
<rect id="cl" class="cln" x="-6" y="-4" width="12" height="8" rx="2"/>
<rect id="sf" class="sfl" x="-8" y="-5" width="16" height="10" rx="2"/>

<!-- program -->
<text class="mono" x="16" y="26" style="font-size:11.5px">ndtwin_switch.p4</text>
<text class="note" x="16" y="42">v1model · BMv2</text>

  <g>
    <line class="ln" x1="280" y1="76" x2="280" y2="101"/>
    <rect class="card" x="165" y="10" width="230" height="66" rx="6"/>
    <text class="cap" x="175" y="25">s1 · BMv2 ingress</text>
    <rect id="s1a" class="row" x="170" y="31" width="220" height="19" rx="3"/>
    <rect id="s1b" class="row" x="170" y="52" width="220" height="19" rx="3"/>
    <text class="tbl" x="176" y="44.5">flow_5tuple</text>
    <text class="tbl" x="176" y="65.5">ipv4_lpm</text>
  </g>

  <g>
    <line class="ln" x1="520" y1="76" x2="520" y2="101"/>
    <rect class="card" x="405" y="10" width="230" height="66" rx="6"/>
    <text class="cap" x="415" y="25">s2 · BMv2 ingress</text>
    <rect id="s2a" class="row" x="410" y="31" width="220" height="19" rx="3"/>
    <rect id="s2b" class="row" x="410" y="52" width="220" height="19" rx="3"/>
    <text class="tbl" x="416" y="44.5">flow_5tuple</text>
    <text class="tbl" x="416" y="65.5">ipv4_lpm</text>
  </g>
<text id="s1t" class="tag hit" x="384" y="44.5">hit · ipv4_forward</text>
<text id="s2m" class="tag miss" x="624" y="44.5">miss</text>
<text id="s2t" class="tag hit" x="624" y="65.5">hit · ipv4_forward</text>

<!-- nodes -->
<rect class="box" x="34" y="104" width="44" height="28" rx="5"/><text class="lbl" x="56" y="122">h1</text>
<rect class="box" x="722" y="104" width="44" height="28" rx="5"/><text class="lbl" x="744" y="122">h2</text>
<rect class="box" x="250" y="101" width="60" height="34" rx="6"/><text class="lbl" x="280" y="122">s1</text>
<rect class="box" x="490" y="101" width="60" height="34" rx="6"/><text class="lbl" x="520" y="122">s2</text>
<rect id="s1h" class="hl" x="250" y="101" width="60" height="34" rx="6"/>
<rect id="s2h" class="hl" x="490" y="101" width="60" height="34" rx="6"/>
<rect class="box" x="320" y="172" width="160" height="34" rx="6"/><text class="lbl" x="400" y="193">P4 proxy agent</text>
<rect class="box" x="600" y="172" width="160" height="34" rx="6"/><text class="lbl" x="680" y="193">NDTwin kernel</text>
<rect id="pxh" class="hl" x="320" y="172" width="160" height="34" rx="6"/>
<rect id="kh" class="hl" x="600" y="172" width="160" height="34" rx="6"/>
<text class="note" x="540" y="179" text-anchor="middle">sFlow v5</text>
<text class="note" x="316" y="170" text-anchor="end">clone to CPU · 1 in 256, random</text>

<!-- legend -->
<g class="lg">
  <rect class="pkt" x="16" y="190" width="12" height="8" rx="2"/><text class="lg" x="33" y="198">packet</text>
  <rect class="cln" x="84" y="190" width="12" height="8" rx="2"/><text class="lg" x="101" y="198">sampled copy</text>
  <rect class="sfl" x="184" y="190" width="12" height="8" rx="2"/><text class="lg" x="201" y="198">sFlow datagram</text>
</g>
</svg>
