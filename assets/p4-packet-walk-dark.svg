#pk{animation:pk 3.2s infinite ease-in-out}
#s1h{animation-name:s1h;animation-duration:3.2s}#s2h{animation-name:s2h;animation-duration:3.2s}
#s1a{animation-name:s1a;animation-duration:3.2s}#s1t{animation-name:s1t;animation-duration:3.2s}
#s2a{animation-name:s2a;animation-duration:3.2s}#s2m{animation-name:s2m;animation-duration:3.2s}
#s2b{animation-name:s2b;animation-duration:3.2s}#s2t{animation-name:s2t;animation-duration:3.2s}
#cl{animation-name:cl}#sf{animation-name:sf}#rt1{animation-name:rt1}#rt2{animation-name:rt2}#ofs{animation-name:ofs}
#pxh{animation-name:pxh;animation-duration:9.600000000000001s}#kh{animation-name:kh;animation-duration:9.600000000000001s}
@keyframes pk{0%,4%{transform:translate(48px,254px)}20%,36%{transform:translate(176px,254px)}54%,70%{transform:translate(404px,254px)}88%,100%{transform:translate(524px,254px)}}
@keyframes s1h{0%,17%,42%,100%{opacity:0}21%,36%{opacity:1}}
@keyframes s2h{0%,51%,76%,100%{opacity:0}55%,70%{opacity:1}}
@keyframes s1a{0%,20%,54%,100%{opacity:0}23%,44%{opacity:1}}
@keyframes s1t{0%,24%,54%,100%{opacity:0}27%,44%{opacity:1}}
@keyframes s2a{0%,54%,67%,100%{opacity:0}57%,62%{opacity:1}}
@keyframes s2m{0%,57%,86%,100%{opacity:0}59%,78%{opacity:1}}
@keyframes s2b{0%,61%,88%,100%{opacity:0}64%,78%{opacity:1}}
@keyframes s2t{0%,64%,88%,100%{opacity:0}67%,78%{opacity:1}}
@keyframes cl{0%,44%{transform:translate(176px,254px);opacity:0}44.6%{opacity:1}51%{transform:translate(212px,178px);opacity:1}51.6%,100%{transform:translate(212px,178px);opacity:0}}
@keyframes pxh{0%,50%,61%,100%{opacity:0}52%,56%{opacity:1}}
@keyframes sf{0%,54%{transform:translate(340px,172px);opacity:0}54.6%{opacity:1}62%{transform:translate(340px,106px);opacity:1}62.6%,100%{transform:translate(340px,106px);opacity:0}}
@keyframes kh{0%,60.5%,74%,100%{opacity:0}63%,68%{opacity:1}}
@keyframes rt1{0%,6%{transform:translate(240px,106px);opacity:0}6.1%{opacity:1}9.5%,11%{transform:translate(240px,168px)}14.5%{transform:translate(240px,106px);opacity:1}14.6%,100%{transform:translate(240px,106px);opacity:0}}
@keyframes rt2{0%,78%{transform:translate(654px,106px);opacity:0}78.1%{opacity:1}81.5%,83%{transform:translate(654px,176px)}86.5%{transform:translate(654px,106px);opacity:1}86.6%,100%{transform:translate(654px,106px);opacity:0}}
@keyframes ofs{0%,20%{transform:translate(764px,250px);opacity:0}20.1%{opacity:1}27%{transform:translate(764px,106px);opacity:1}27.1%,100%{transform:translate(764px,106px);opacity:0}}
@media (prefers-reduced-motion:reduce){#pk,.hl,.hlf,.row,.tag,.mv{animation:none}#pk{transform:translate(290px,254px)}#cl{transform:translate(194px,216px);opacity:1}#sf{transform:translate(340px,138px);opacity:1}}
</style>

